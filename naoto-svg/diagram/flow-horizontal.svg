<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 250" role="img" aria-label="制作の流れ 全5ステップ">
<style>
  .num   { font-family:"Anton", sans-serif; font-size:26px; fill:currentColor; }
