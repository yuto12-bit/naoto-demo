<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 700" role="img" aria-label="制作の流れ 全5ステップ">
<style>
  .num   { font-family:"Anton", sans-serif; font-size:26px; fill:currentColor; }
  .jp    { font-family:"Noto Sans JP", system-ui, sans-serif; font-weight:900; font-size:21px; fill:currentColor; }
  .en    { font-family:"Anton", sans-serif; font-size:11px; letter-spacing:.22em; fill:currentColor; opacity:.5; }
  .note  { font-family:"Noto Sans JP", system-ui, sans-serif; font-size:12.5px; fill:currentColor; opacity:.66; }
  .ring  { fill:none; stroke:currentColor; stroke-width:3.2; }
  .base  { stroke:currentColor; stroke-width:2.4; }
  .tick  { stroke:currentColor; stroke-width:2.4; }
  .arw   { fill:var(--vermil,#D3381C); }
  .arwl  { stroke:var(--vermil,#D3381C); stroke-width:3.4; }
</style>
